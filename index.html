<script>
/* Pembuat PDF mini (tanpa library): garis, teks Helvetica, gambar JPEG */
class MiniPDF{
  constructor(w,h){this.w=w;this.h=h;this.out=[];this.font='F1';this.fam='';this.fs=12;this.col='0 0 0 rg';this.dc='0 0 0 RG';this.lw=1;this.cs=0;this.imgs=[];
    this.cv=document.createElement('canvas').getContext('2d');}
  setFont(n,s){s=s||'normal';const b=s==='bold'||s==='bolditalic',i=s==='italic'||s==='bolditalic';
    this.font=b?(i?'F4':'F2'):(i?'F3':'F1');this.fam=(i?'italic ':'')+(b?'bold ':'');}
  setFontSize(s){this.fs=s}
  setTextColor(r,g,b){if(g===undefined)g=b=r;this.col=(r/255)+' '+(g/255)+' '+(b/255)+' rg'}
  setDrawColor(r,g,b){if(g===undefined)g=b=r;this.dc=(r/255)+' '+(g/255)+' '+(b/255)+' RG'}
  setLineWidth(w){this.lw=w}
  setCharSpace(c){this.cs=c}
  tw(t){this.cv.font=this.fam+'100px Arial, Helvetica, sans-serif';return this.cv.measureText(t).width*this.fs/100+this.cs*t.length}
  esc(t){let s='';for(const ch of String(t)){const c=ch.charCodeAt(0);const m=c<256?ch:'?';s+=(m==='('||m===')'||m==='\\')?'\\'+m:m}return s}
  text(t,x,y,o){t=String(t);if(!t)return;o=o||{};const w=this.tw(t);
    if(o.align==='center')x-=w/2;else if(o.align==='right')x-=w;
    y+=this.fs*0.35;
    this.out.push(`BT ${this.col} /${this.font} ${this.fs} Tf ${this.cs} Tc ${x.toFixed(2)} ${(this.h-y).toFixed(2)} Td (${this.esc(t)}) Tj ET`)}
  line(x1,y1,x2,y2){this.out.push(`${this.dc} ${this.lw} w ${x1.toFixed(2)} ${(this.h-y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.h-y2).toFixed(2)} l S`)}
  addImage(im,x,y,w,h){let n=this.imgs.indexOf(im);if(n<0){this.imgs.push(im);n=this.imgs.length-1}
    this.out.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${(this.h-y-h).toFixed(2)} cm /Im${n} Do Q`)}
  blob(){
    const enc=new TextEncoder(),parts=[],offs=[];let pos=0;
    const push=u=>{parts.push(u);pos+=u.length};
    const str=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u};
    const obj=(n,body)=>{offs[n]=pos;push(str(n+' 0 obj\n'));push(typeof body==='string'?str(body):body);push(str('\nendobj\n'))};
    push(str('%PDF-1.4\n'));
    const nImg=this.imgs.length,fontBase=5,imgBase=9;
    obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
    obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    let xo='';for(let i=0;i<nImg;i++)xo+=`/Im${i} ${imgBase+i} 0 R `;
    obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.w} ${this.h}] /Contents 4 0 R /Resources << /Font << /F1 5 0 R /F2 6 0 R /F3 7 0 R /F4 8 0 R >> /XObject << ${xo}>> >> >>`);
    const content=str(this.out.join('\n'));
    obj(4,(()=>{const a=str(`<< /Length ${content.length} >>\nstream\n`),b=str('\nendstream');const u=new Uint8Array(a.length+content.length+b.length);u.set(a);u.set(content,a.length);u.set(b,a.length+content.length);return u})());
    ['Helvetica','Helvetica-Bold','Helvetica-Oblique','Helvetica-BoldOblique'].forEach((f,i)=>obj(fontBase+i,`<< /Type /Font /Subtype /Type1 /BaseFont /${f} /Encoding /WinAnsiEncoding >>`));
    this.imgs.forEach((im,i)=>{const d=im.jpg;const a=str(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${d.length} >>\nstream\n`),b=str('\nendstream');
      const u=new Uint8Array(a.length+d.length+b.length);u.set(a);u.set(d,a.length);u.set(b,a.length+d.length);obj(imgBase+i,u)});
    const total=imgBase+nImg;const xref=pos;
    let x='xref\n0 '+total+'\n0000000000 65535 f \n';
    for(let i=1;i<total;i++)x+=String(offs[i]||0).padStart(10,'0')+' 00000 n \n';
    push(str(x+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`));
    return new Blob(parts,{type:'application/pdf'});
  }
}
</script>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>isFinite(n)?Math.round(n).toLocaleString('en-US'):'';
const num=s=>parseFloat(String(s).replace(/[^0-9.\-]/g,''))||0;
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const img={logo:null,sig:null};

function rowHTML(i,d){d=d||{};return `<tr>
<td class="no">${i}<button class="rm" onclick="delRow(this)">×</button></td>
<td class="l"><input class="item" value="${esc(d.item)}"><input class="note" value="${esc(d.note)}"></td>
<td class="l"><input class="grade" value="${esc(d.grade)}"></td>
<td><input class="sak" inputmode="numeric" value="${esc(d.sak)}"></td>
<td><input class="kg" inputmode="numeric" value="${esc(d.kg)}" oninput="calc()"></td>
<td><input class="price" inputmode="numeric" value="${esc(d.price)}" oninput="calc()"></td>
<td class="tot" style="font-size:14.5px;padding-top:11px"></td></tr>`}
function addRow(d){const b=$('body');b.insertAdjacentHTML('beforeend',rowHTML(b.rows.length+1,d));calc();renderRows();scheduleSave()}
function delRow(btn){if($('body').rows.length<2)return;btn.closest('tr').remove();[...$('body').rows].forEach((r,i)=>r.cells[0].firstChild.nodeValue=i+1);calc();renderRows();scheduleSave()}
function getRows(){return [...$('body').rows].map(r=>{const q=c=>r.querySelector('.'+c).value;const kg=num(q('kg')),p=num(q('price'));return{item:q('item'),note:q('note'),grade:q('grade'),sak:q('sak'),kg:q('kg'),price:q('price'),kgn:kg,pn:p,tot:kg*p}})}
function calc(){
  let tk=0,tt=0;
  [...$('body').rows].forEach(r=>{
    const kg=num(r.querySelector('.kg').value),p=num(r.querySelector('.price').value),t=kg*p;
    r.querySelector('.tot').textContent=t?fmt(t):'';tk+=kg;tt+=t;
  });
  $('tkg').textContent=tk?String(tk):'';$('ttot').textContent=fmt(tt);
  $('s1').textContent=fmt(tt);$('s2').textContent=fmt(tt-num($('dp').value));
  fit();
}
function fit(){
  const p=$('page'),s=Math.min(1,(window.innerWidth-8)/984);
  p.style.transform='scale('+s+')';
  $('stage').style.width=(984*s)+'px';$('stage').style.height=(p.offsetHeight*s)+'px';
}
window.addEventListener('resize',fit);

function processImg(key,src,cb){
  const im=new Image();im.onload=()=>{
    const m=Math.min(1,600/Math.max(im.width,im.height)),w=Math.round(im.width*m),h=Math.round(im.height*m);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
    const url=c.toDataURL('image/png');
    const c2=document.createElement('canvas');c2.width=w;c2.height=h;const x2=c2.getContext('2d');x2.fillStyle='#fff';x2.fillRect(0,0,w,h);x2.drawImage(im,0,0,w,h);
    const bin=atob(c2.toDataURL('image/jpeg',0.92).split(',')[1]),jpg=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)jpg[i]=bin.charCodeAt(i);
    img[key]={url,w,h,jpg};
    $(key+'img').src=url;$(key+'box').classList.add('has');
    if(cb)cb();
  };im.src=src;
}
function loadImg(inp,key){
  const f=inp.files[0];if(!f)return;const fr=new FileReader();
  fr.onload=e=>processImg(key,e.target.result,save);fr.readAsDataURL(f);inp.value='';
}
function resetAll(){
  if(!confirm('Kosongkan semua isian (termasuk data tersimpan)?'))return;
  ['tgl','kirim','kepada','pt','noinv'].forEach(i=>$(i).value='');
  img.logo=null;img.sig=null;$('logobox').classList.remove('has');$('sigbox').classList.remove('has');
  $('dp').value='0';$('body').innerHTML='';addRow();syncForm();save();
}

/* ---------- Simpan otomatis ---------- */
const KEY='invoice-kanbarra-data-v1';
const FIELDS=['tgl','kirim','kepada','pt','noinv','lt1','lt2','dp','bank','an','ac','appr'];
let st=null;
function save(){
  try{
    const d={f:{},rows:[...$('body').rows].map(r=>{const q=c=>r.querySelector('.'+c).value;return{item:q('item'),note:q('note'),grade:q('grade'),sak:q('sak'),kg:q('kg'),price:q('price')}}),
      logo:img.logo?img.logo.url:null,sig:img.sig?img.sig.url:null};
    FIELDS.forEach(i=>d.f[i]=$(i).value);
    localStorage.setItem(KEY,JSON.stringify(d));
  }catch(e){}
}
function scheduleSave(){clearTimeout(st);st=setTimeout(save,400)}
function restore(){
  try{
    const raw=localStorage.getItem(KEY);if(!raw)return false;
    const d=JSON.parse(raw);
    FIELDS.forEach(i=>{if(d.f&&d.f[i]!==undefined)$(i).value=d.f[i]});
    $('body').innerHTML='';
    (d.rows&&d.rows.length?d.rows:[{}]).forEach(r=>addRow(r));
    if(d.logo)processImg('logo',d.logo);
    if(d.sig)processImg('sig',d.sig);
    calc();return true;
  }catch(e){return false}
}
document.addEventListener('input',scheduleSave);
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

/* ---------- PDF ---------- */
function makePDF(mode){
  const rows=getRows();
  const RH=67;
  const tTop=192,hEnd=237,dEnd=hEnd+RH*rows.length,tEnd=dEnd+23;
  const sTop=tEnd+22,sh=[24,32,24,25],sEnd=sTop+sh.reduce((a,b)=>a+b,0);
  const H=Math.max(695,sEnd+240);
  const doc=new MiniPDF(984,H);
  const T=(t,x,y,size,o)=>{o=o||{};doc.setFont('helvetica',o.style||'normal');doc.setFontSize(size);
    doc.setTextColor.apply(doc,o.color||[0,0,0]);
    if(o.cs)doc.setCharSpace(o.cs);
    doc.text(String(t),x,y,{align:o.align||'left',baseline:'middle'});
    if(o.cs)doc.setCharSpace(0)};
  const L=(x1,y1,x2,y2,w)=>{doc.setLineWidth(w||1);doc.setDrawColor(0);doc.line(x1,y1,x2,y2)};

  // header
  T('INVOICE',134,31,24,{style:'italic'});
  L(134,43,852,43,1.5);
  T('Invoice Date:',134,51,14);
  T($('tgl').value,134,75,12);
  T($('kirim').value,134,99,11.5);
  T($('kepada').value,134,123,14);
  T($('pt').value,134,147,14);
  T('No.Invoice:',445,54,14);
  T($('noinv').value,445,82,16);
  // logo
  if(img.logo){
    const b=img.logo,r=Math.min(158/b.w,96/b.h),w=b.w*r,h=b.h*r;
    doc.addImage(b,769-w/2,84+(96-h)/2,w,h);
  }else{
    const cx=769,pts=[[14,'o'],[22,'o'],[32,'b'],[40,'b']];
    pts.forEach(([cy,c])=>{

  T('PRICE/Kg',656.5,225.5,14,{align:'center'});T('TOTAL',772,225.5,14,{align:'center'});
  // body
  let tk=0,tt=0;
  rows.forEach((r,i)=>{
    const y0=hEnd+RH*i;tk+=r.kgn;tt+=r.tot;
    if(i>0)L(X[0],y0,X[7],y0);
    T(i+1,169,y0+20,14.5,{align:'center'});
    T(r.item,214,y0+20,14.5);T(r.note,214,y0+43,12.5);
    T(r.grade,351,y0+20,14.5);

/* ---------- Form input & Cetak ---------- */
const FORM_SECTIONS=[
 ['Informasi Invoice',[['noinv','No. Invoice'],['tgl','Tanggal invoice'],['kirim','Keterangan pengantaran'],['kepada','Kepada (nama)'],['pt','Perusahaan penerima']]],
 ['Logo Perusahaan',[['lt1','Nama perusahaan (teks logo)'],['lt2','Slogan (teks logo)']],'logo'],
 ['Pembayaran',[['dp','DP (Rp)']]],
 ['Rekening Bank',[['bank','Bank'],['an','Atas nama'],['ac','Nomor rekening']]],
 ['Persetujuan',[['appr','Nama penyetuju']],'sig']
];
function removeImg(key){img[key]=null;$(key+'box').classList.remove('has');save()}
function buildForm(){
  const fv=$('formView');let h='';
  FORM_SECTIONS.forEach(([title,fields,imgKey],si)=>{
    if(si===2){ // sebelum Pembayaran: kartu barang
      h+='<div class="fcard"><h3>Barang</h3><div id="rowsForm"></div><button class="fbtn g" onclick="addRow()">+ Tambah Barang</button></div>';
    }
    h+=`<div class="fcard"><h3>${title}</h3>`;
    fields.forEach(([id,label])=>{
      h+=`<label class="fl" for="f_${id}">${label}</label><input class="fi" id="f_${id}" data-twin="${id}" ${id==='dp'?'inputmode="numeric"':''}>`;
    });
    if(imgKey){
      const nm=imgKey==='logo'?'logo':'tanda tangan';
      h+=`<label class="fl">Gambar ${nm}</label><div><label class="fbtn o" style="display:inline-block">Unggah ${nm}<input type="file" accept="image/*" style="display:none" onchange="loadImg(this,'${imgKey}')"></label><button class="fbtn o" onclick="removeImg('${imgKey}')">Hapus gambar</button></div>`;
    }
    h+='</div>';
  });
  h+='<div class="fcard"><h3>Ringkasan</h3><div class="sumline"><span>Total Invoice</span><b id="f_s1"></b></div><div class="sumline"><span>DP</span><b id="f_sdp"></b></div><div class="sumline"><span>Sisa tagihan</span><b id="f_s2"></b></div></div>';
  h+='<div style="margin:6px 0">';
  h+='<button class="fbtn" onclick="setView(\'sheet\')">Lihat Lembar</button><button class="fbtn g" onclick="printInv()">Cetak</button><button class="fbtn" style="background:#1565c0" onclick="makePDF(\'download\')">Unduh PDF</button><button class="fbtn r" onclick="resetAll()">Reset</button>';
  h+='</div>';
  fv.innerHTML=h;
  renderRows();syncForm();
}
function renderRows(){
  const box=$('rowsForm');if(!box)return;
  const rows=getRows();
  box.innerHTML=rows.map((r,i)=>`<div class="fcard" style="background:#f6f8f8;box-shadow:none;border:1px solid #dde3e3">
   <h3>Barang ${i+1}<button class="fbtn r sm" onclick="delRowIdx(${i})">Hapus</button></h3>
   <label class="fl">Nama barang</label><input class="fi" data-row="${i}" data-f="item">
   <label class="fl">Keterangan</label><input class="fi" data-row="${i}" data-f="note">
   <label class="fl">Grade</label><input class="fi" data-row="${i}" data-f="grade">
   <div class="g2"><div><label class="fl">Jumlah (sak)</label><input class="fi" inputmode="numeric" data-row="${i}" data-f="sak"></div>
   <div><label class="fl">Berat (Kg)</label><input class="fi" inputmode="numeric" data-row="${i}" data-f="kg"></div></div>
   <label class="fl">Harga per Kg (Rp)</label><input class="fi" inputmode="numeric" data-row="${i}" data-f="price">
   <div class="rt" id="f_rt${i}"></div></div>`).join('');
  syncForm();
}
function delRowIdx(i){const r=$('body').rows[i];if(r)delRow(r.querySelector('.rm'))}
function syncForm(){
  if(!$('rowsForm'))return;
  const rows=[...$('body').rows];
  if(document.querySelectorAll('#rowsForm [data-f="item"]').length!==rows.length){renderRows();return}
  document.querySelectorAll('#formView [data-twin]').forEach(t=>{const v=$(t.dataset.twin).value;if(t.value!==v)t.value=v});
  document.querySelectorAll('#rowsForm [data-row]').forEach(t=>{const s=rows[+t.dataset.row].querySelector('.'+t.dataset.f);if(s&&t.value!==s.value)t.value=s.value});
  rows.forEach((r,i)=>{const e=$('f_rt'+i);if(e)e.textContent='Total: Rp '+(r.querySelector('.tot').textContent||'0')});
  $('f_s1').textContent='Rp '+$('s1').textContent;$('f_sdp').textContent='Rp '+fmt(num($('dp').value));$('f_s2').textContent='Rp '+$('s2').textContent;
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.closest&&t.closest('#formView')){
    if(t.dataset.twin){$(t.dataset.twin).value=t.value}
    else if(t.dataset.row!==undefined){const s=$('body').rows[+t.dataset.row].querySelector('.'+t.dataset.f);if(s)s.value=t.value}
    calc();
  }
  syncForm();
});
function setView(v){
  document.body.classList.remove('view-form','view-sheet');document.body.classList.add('view-'+v);
  $('tabForm').classList.toggle('on',v==='form');$('tabSheet').classList.toggle('on',v==='sheet');
  syncForm();if(v==='sheet')fit();window.scrollTo(0,0);
}
function printInv(){
  calc();
  const wasForm=document.body.classList.contains('view-form');
  if(wasForm)setView('sheet');
  setTimeout(()=>{
    const h=$('page').offsetHeight;
    const pz=Math.max(0.4,Math.min(1,1030/984,715/h));
    document.documentElement.style.setProperty('--pz',pz);
    if(wasForm)window.addEventListener('afterprint',()=>setView('form'),{once:true});
    window.print();
  },250);
}
